spring:
  application:
    name: chat_service
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres?currentSchema=chat_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    jpa:
      show-sql: false
      hibernate:
        ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      properties:
        hibernate:
          default_schema: chat_service
    liquibase:
      enabled: true
      change-log: classpath:db/master.xml
